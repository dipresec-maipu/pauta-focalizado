<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pauta focalizada PCSP</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --azul: #1f5fbf;
      --verde: #16894a;
      --amarillo: #f2b705;
      --gris: #f5f5f5;
      --texto: #1f2937;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; color: var(--texto); background: #fff; }
    .app { display: flex; flex-direction: column; height: 100vh; }
    .header { padding: 10px 12px; background: #0f2742; color: white; }
    .header h1 { margin: 0; font-size: 17px; }
    .header p { margin: 4px 0 0 0; font-size: 12px; opacity: 0.9; }
    .controls { padding: 8px; background: white; display: grid; grid-template-columns: 1fr; gap: 8px; border-bottom: 1px solid #ddd; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    select, button { padding: 9px; border: 1px solid #ccc; border-radius: 8px; background: white; font-size: 14px; }
    button.primary { background: #0f2742; color: white; border-color: #0f2742; }
    .toggles { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; }
    .toggles label { border: 1px solid #ddd; padding: 6px 8px; border-radius: 999px; background: #f8fafc; }
    .cuad-box { display: flex; gap: 6px; flex-wrap: wrap; max-height: 82px; overflow: auto; padding: 2px; }
    .cuad-box label { border: 1px solid #d1d5db; border-radius: 999px; padding: 6px 8px; background: #f8fafc; font-size: 12px; }
    .cuad-box input { margin-right: 3px; }
    #map { flex: 1; min-height: 42vh; }
    .panel { max-height: 34vh; overflow: auto; background: white; border-top: 1px solid #ddd; }
    .card { padding: 10px; border-bottom: 1px solid #e5e7eb; }
    .card h3 { margin: 0 0 4px 0; font-size: 15px; }
    .card p { margin: 2px 0; font-size: 13px; }
    .badge { display: inline-block; padding: 2px 7px; border-radius: 999px; color: white; font-size: 11px; margin-right: 4px; }
    .moviles { background: var(--azul); }
    .motoristas { background: var(--verde); }
    .delta { background: #b48600; }
    .acciones { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    .acciones a, .acciones button { text-decoration: none; padding: 7px 9px; border-radius: 8px; color: white; font-size: 13px; border: none; }
    .maps { background: #2563eb; }
    .survey { background: #059669; }
    .loc { background: #7c3aed; }
    .hint { font-size: 12px; color: #4b5563; margin: 0; }
    .label-numero {
      background: rgba(15, 39, 66, 0.92);
      color: white;
      border: 2px solid white;
      border-radius: 999px;
      width: 24px;
      height: 24px;
      line-height: 20px;
      text-align: center;
      font-weight: 700;
      font-size: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.45);
    }
    .leaflet-popup-content { font-size: 13px; }
    @media (min-width: 800px) {
      .controls { grid-template-columns: 1.2fr 1.4fr 1fr; align-items: start; }
      #map { min-height: 62vh; }
      .panel { max-height: 28vh; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Pauta focalizada PCSP</h1>
    <p>ID pauta: PF_PCSP_20260406_20260503 · filtros por equipo/cuadrante · grilla metodológica · ubicación del dispositivo</p>
  </div>

  <div class="controls">
    <div>
      <div class="row">
        <select id="filtroEquipo">
          <option value="Todos">Todos los equipos</option>
          <option value="Móviles">Móviles</option>
          <option value="Motoristas">Motoristas</option>
          <option value="Delta">Delta</option>
        </select>
        <select id="filtroProblema">
          <option value="Todas">Todas las problemáticas</option>
          <option value="Robos violentos">Robos violentos</option>
          <option value="Robo en lugar habitado">Robo en lugar habitado</option>
          <option value="Violencia intrafamiliar">VIF</option>
          <option value="Alcohol y drogas en vía pública">Alcohol/drogas</option>
        </select>
      </div>
      <p class="hint">El filtro de cuadrantes cambia según el equipo seleccionado.</p>
    </div>

    <div>
      <div id="filtroCuadrantes" class="cuad-box"></div>
      <div class="acciones">
        <button type="button" class="primary" onclick="marcarCuadrantes(true)">Todos</button>
        <button type="button" onclick="marcarCuadrantes(false)">Limpiar</button>
      </div>
    </div>

    <div>
      <div class="toggles">
        <label><input type="checkbox" id="verPuntos" checked> Puntos</label>
        <label><input type="checkbox" id="verEtiquetas" checked> Números</label>
        <label><input type="checkbox" id="verRutas" checked> Ruta sugerida</label>
        <label><input type="checkbox" id="verCuadrantes" checked> Cuadrantes</label>
        <label><input type="checkbox" id="verGrilla"> Grilla</label>
      </div>
      <div class="acciones">
        <button type="button" class="loc" onclick="activarUbicacion()">📍 Mi ubicación</button>
      </div>
      <p class="hint" id="estadoUbicacion">La ubicación requiere permiso del navegador y funciona mejor con HTTPS.</p>
    </div>
  </div>

  <div id="map"></div>
  <div class="panel" id="listaPuntos"></div>
</div>

ygon", "coordinates": [[[-70.77519982480389, -33.55294010053265], [-70.77512605313682, -33.54933400665578], [-70.77081929228856, -33.54939569617366], [-70.7708928852012, -33.553001798432625], [-70.77519982480389, -33.55294010053265]]]}}, {"type": "Feature", "properties": {"cuadrante": "223B", "grid_id": "223B_G0041", "problematica_pcsp": "Violencia intrafamiliar", "casos_problematica_celda": 2, "equipo": "Móviles", "tamano_grilla_m": 400}, "geometry": {"type": "Polygon", "coordinates": [[[-70.75782588764952, -33.54597373696357], [-70.76213250896714, -33.54591250488568], [-70.76205929963663, -33.54230638143354], [-70.76120566731346, -33.54231852924672], [-70.7597754780711, -33.54296876265129], [-70.75894469360998, -33.54334140403882], [-70.75778332324329, -33.54387205534781], [-70.75782588764952, -33.54597373696357]]]}}, {"type": "Feature", "properties": {"cuadrante": "223B", "grid_id": "223B_G0013", "problematica_pcsp": "Violencia intrafamiliar", "casos_problematica_celda": 1, "equipo": "Móviles", "tamano_grilla_m": 400}, "geometry": {"type": "Polygon", "coordinates": [[[-70.77497854918978, -33.542121812160815], [-70.77505229459952, -33.545727910531774], [-70.77935886359755, -33.545666079712134], [-70.7792985906824, -33.54272595633214], [-70.77836311856693, -33.542073235982954], [-70.77497854918978, -33.542121812160815]]]}}]};

const map = L.map('map').setView([-33.508315, -70.766154], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

function colorEquipo(equipo) {
  if (equipo === 'Móviles') return '#1f5fbf';
  if (equipo === 'Motoristas') return '#16894a';
  if (equipo === 'Delta') return '#f2b705';
  return '#777777';
}

function colorProblema(prob) {
  if (prob === 'Robos violentos') return '#c0392b';
  if (prob === 'Robo en lugar habitado') return '#8e44ad';
  if (prob === 'Violencia intrafamiliar') return '#e67e22';
  if (prob === 'Alcohol y drogas en vía pública') return '#16a085';
  return '#34495e';
}

let capasPuntos = L.layerGroup().addTo(map);
let capasEtiquetas = L.layerGroup().addTo(map);
let capasRutas = L.layerGroup().addTo(map);
let capasCuadrantes = L.layerGroup().addTo(map);
let capasGrilla = L.layerGroup();
let markerUbicacion = null;
let accuracyCircle = null;
let watchId = null;

function opcionesCuadrantesDisponibles() {
  const equipo = document.getElementById('filtroEquipo').value;
  const set = new Set();
  puntosData.features.forEach(f => {
    const p = f.properties;
    if (equipo === 'Todos' || p.equipo === equipo) set.add(p.cuadrante);
  });
  return Array.from(set).sort((a,b) => a.localeCompare(b, 'es', {numeric:true}));
}

function cuadrantesSeleccionados() {
  return Array.from(document.querySelectorAll('#filtroCuadrantes input[type=checkbox]:checked')).map(x => x.value);
}

function actualizarOpcionesCuadrante(preservar=true) {
  const prev = preservar ? new Set(cuadrantesSeleccionados()) : new Set();
  const cont = document.getElementById('filtroCuadrantes');
  const disponibles = opcionesCuadrantesDisponibles();
  cont.innerHTML = '';
  disponibles.forEach(c => {
    const checked = prev.size === 0 ? true : prev.has(c);
    cont.innerHTML += `<label><input type="checkbox" value="${c}" ${checked ? 'checked' : ''}> ${c}</label>`;
  });
  cont.querySelectorAll('input').forEach(chk => chk.addEventListener('change', render));
}

function marcarCuadrantes(valor) {
  document.querySelectorAll('#filtroCuadrantes input[type=checkbox]').forEach(chk => chk.checked = valor);
  render();
}

function filtroBaseProps(p) {
  const equipo = document.getElementById('filtroEquipo').value;
  const problema = document.getElementById('filtroProblema').value;
  const cuads = cuadrantesSeleccionados();
  const okEquipo = equipo === 'Todos' || p.equipo === equipo || p.equipo_asignado === equipo;
  const cuadValor = p.cuadrante || p.cuadrante_celda || p.NUM_CUAD;
  const okCuad = cuads.includes(cuadValor);
  let okProblema = true;
  if (problema !== 'Todas') {
    const probs = p.problematicas_asociadas || p.problematica_pcsp || '';
    okProblema = probs.includes(problema);
  }
  return okEquipo && okCuad && okProblema;
}

function cumpleFiltroPunto(feature) { return filtroBaseProps(feature.properties); }
function cumpleFiltroCelda(feature) { return filtroBaseProps(feature.properties); }
function cumpleFiltroCuadrante(feature) {
  const p = feature.properties;
  const equipo = document.getElementById('filtroEquipo').value;
  const cuads = cuadrantesSeleccionados();
  const okEquipo = equipo === 'Todos' || p.equipo_asignado === equipo;
  const okCuad = cuads.includes(p.NUM_CUAD || p.cuadrante);
  return okEquipo && okCuad;
}

function popupPunto(p) {
  const survey = p.url_survey123 ? `<a class="survey" href="${p.url_survey123}" target="_blank">Registrar</a>` : '';
  return `<b>${p.orden_ruta}. ${p.interseccion}</b><br>
    <b>Equipo:</b> ${p.equipo}<br>
    <b>Cuadrante:</b> ${p.cuadrante}<br>
    <b>Problemática:</b> ${p.problematicas_asociadas}<br>
    <b>Casos asociados:</b> ${p.casos_total}<br>
    <b>Distancia centro delitos/intersección:</b> ${p.distancia_interseccion_m} m<br>
    <b>Grilla origen:</b> ${p.grid_ids_origen || p.grid_id_origen || ''}<br>
    <div class="acciones">
      <a class="maps" href="${p.url_google_maps}" target="_blank">Abrir en Google Maps</a>
      ${survey}
    </div>`;
}

function popupCelda(p) {
  return `<b>Celda crítica</b><br>
    <b>Cuadrante:</b> ${p.cuadrante}<br>
    <b>Equipo:</b> ${p.equipo}<br>
    <b>Problemática:</b> ${p.problematica_pcsp}<br>
    <b>Casos en celda:</b> ${p.casos_problematica_celda}<br>
    <b>Tamaño grilla:</b> ${p.tamano_grilla_m || ''} m<br>
    <b>ID:</b> ${p.grid_id}`;
}

function render() {
  capasPuntos.clearLayers();
  capasEtiquetas.clearLayers();
  capasRutas.clearLayers();
  capasCuadrantes.clearLayers();
  capasGrilla.clearLayers();
  const lista = document.getElementById('listaPuntos');
  lista.innerHTML = '';

  const visibles = puntosData.features.filter(cumpleFiltroPunto)
    .sort((a,b) => (a.properties.equipo + a.properties.cuadrante + String(a.properties.orden_ruta).padStart(3,'0')).localeCompare(b.properties.equipo + b.properties.cuadrante + String(b.properties.orden_ruta).padStart(3,'0')));

  if (document.getElementById('verCuadrantes').checked) {
    L.geoJSON(cuadrantesData, {
      filter: cumpleFiltroCuadrante,
      style: f => {
        const equipo = f.properties.equipo_asignado;
        return { color: colorEquipo(equipo), weight: 2, fillOpacity: 0.08 };
      },
      onEachFeature: (f, layer) => layer.bindPopup(`<b>Cuadrante ${f.properties.NUM_CUAD}</b><br>Equipo: ${f.properties.equipo_asignado}<br>Total PCSP: ${f.properties.Total_PCSP}`)
    }).addTo(capasCuadrantes);
  }

  if (document.getElementById('verGrilla').checked) {
    L.geoJSON(celdasData, {
      filter: cumpleFiltroCelda,
      style: f => {
        const p = f.properties;
        return { color: colorProblema(p.problematica_pcsp), weight: 2, fillOpacity: 0.13, dashArray: '4,4' };
      },
      onEachFeature: (f, layer) => layer.bindPopup(popupCelda(f.properties))
    }).addTo(capasGrilla);
    if (!map.hasLayer(capasGrilla)) capasGrilla.addTo(map);
  } else {
    if (map.hasLayer(capasGrilla)) map.removeLayer(capasGrilla);
  }

  if (document.getElementById('verPuntos').checked) {
    visibles.forEach(f => {
      const p = f.properties;
      const coords = f.geometry.coordinates;
      const marker = L.circleMarker([coords[1], coords[0]], {
        radius: 8,
        color: '#111',
        weight: 1,
        fillColor: colorProblema(p.problematica_principal),
        fillOpacity: 0.92
      }).bindPopup(popupPunto(p));
      marker.addTo(capasPuntos);

      if (document.getElementById('verEtiquetas').checked) {
        const labelIcon = L.divIcon({
          className: 'label-numero',
          html: String(p.orden_ruta),
          iconSize: [24, 24],
          iconAnchor: [12, 12]
        });
        L.marker([coords[1], coords[0]], {icon: labelIcon, interactive: false}).addTo(capasEtiquetas);
      }
    });
  }

  if (document.getElementById('verRutas').checked) {
    const grupos = {};
    visibles.forEach(f => {
      const p = f.properties;
      const key = `${p.equipo}|${p.cuadrante}`;
      if (!grupos[key]) grupos[key] = [];
      grupos[key].push(f);
    });
    Object.entries(grupos).forEach(([key, feats]) => {
      if (feats.length < 2) return;
      feats.sort((a,b) => a.properties.orden_ruta - b.properties.orden_ruta);
      const coords = feats.map(f => [f.geometry.coordinates[1], f.geometry.coordinates[0]]);
      const equipo = feats[0].properties.equipo;
      L.polyline(coords, { color: colorEquipo(equipo), weight: 3, opacity: 0.55, dashArray: '6,6' }).addTo(capasRutas);
    });
  }

  visibles.forEach(f => {
    const p = f.properties;
    const surveyBtn = p.url_survey123 ? `<a class="survey" href="${p.url_survey123}" target="_blank">Registrar</a>` : '';
    const clase = p.equipo === 'Móviles' ? 'moviles' : (p.equipo === 'Motoristas' ? 'motoristas' : 'delta');
    lista.innerHTML += `<div class="card">
      <h3>${p.orden_ruta}. ${p.interseccion}</h3>
      <p><span class="badge ${clase}">${p.equipo}</span> Cuadrante ${p.cuadrante}</p>
      <p><b>Problemática:</b> ${p.problematicas_asociadas}</p>
      <p><b>Casos:</b> ${p.casos_total} · <b>Dist.:</b> ${p.distancia_interseccion_m} m</p>
      <div class="acciones">
        <a class="maps" href="${p.url_google_maps}" target="_blank">Google Maps</a>
        ${surveyBtn}
      </div>
    </div>`;
  });

  if (visibles.length > 0 && document.getElementById('verPuntos').checked) {
    const group = L.featureGroup(capasPuntos.getLayers());
    if (group.getLayers().length > 0) map.fitBounds(group.getBounds().pad(0.25));
  }
}

function activarUbicacion() {
  const estado = document.getElementById('estadoUbicacion');
  if (!navigator.geolocation) {
    estado.innerText = 'Este navegador no permite geolocalización.';
    return;
  }
  estado.innerText = 'Solicitando ubicación...';
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition(pos => {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    const acc = pos.coords.accuracy;
    const latlng = [lat, lon];
    if (!markerUbicacion) {
      markerUbicacion = L.marker(latlng).addTo(map).bindPopup('Mi ubicación aproximada');
      accuracyCircle = L.circle(latlng, {radius: acc, color: '#7c3aed', fillOpacity: 0.08}).addTo(map);
      map.setView(latlng, 16);
    } else {
      markerUbicacion.setLatLng(latlng);
      accuracyCircle.setLatLng(latlng).setRadius(acc);
    }
    estado.innerText = `Ubicación activa · precisión aprox. ${Math.round(acc)} m`;
  }, err => {
    estado.innerText = 'No se pudo obtener ubicación: ' + err.message;
  }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 15000 });
}

document.getElementById('filtroEquipo').addEventListener('change', () => { actualizarOpcionesCuadrante(false); render(); });
document.getElementById('filtroProblema').addEventListener('change', render);
['verPuntos','verEtiquetas','verRutas','verCuadrantes','verGrilla'].forEach(id => document.getElementById(id).addEventListener('change', render));
actualizarOpcionesCuadrante(false);
render();
</script>
</body>
</html>
